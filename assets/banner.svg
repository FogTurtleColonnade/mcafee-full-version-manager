<!-- Large shield on right -->
<g transform="translate(940,180)">
<path d="M0,-120 L95,-85 L95,15 C95,90 45,140 0,155 C-45,140 -95,90 -95,15 L-95,-85 Z"
fill="url(#shieldGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
<path d="M0,-120 L95,-85 L95,15 C95,90 45,140 0,155 Z" fill="url(#shieldInner)"/>
<path d="M-45,0 L-15,32 L48,-42" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- concentric protective rings -->
<circle cx="940" cy="180" r="175" fill="none" stroke="#ff4d4d" stroke-opacity="0.25" stroke-width="1.5"/>
<circle cx="940" cy="180" r="215" fill="none" stroke="#ff4d4d" stroke-opacity="0.12" stroke-width="1.5"/>

<!-- side accent bar -->
<rect x="60" y="90" width="6" height="170" fill="#ff2d2d"/>

<text x="80" y="160" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="url(#headTxt)" textLength="1080.0" lengthAdjust="spacingAndGlyphs" font-size="62.2">
McAfee Full Version Download
</text>

<text x="80" y="220" font-family="'Segoe UI', Arial, sans-serif" fill="#f0c9c9" textLength="1080.0" lengthAdjust="spacingAndGlyphs" font-size="19.8">
Download and activate the full version of McAfee antivirus with complete feature access.
</text>

