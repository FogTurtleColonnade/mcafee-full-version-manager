<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1a0505"/>
<stop offset="50%" stop-color="#2b0a0a"/>
<stop offset="100%" stop-color="#120303"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ff2d2d" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ff5050"/>
<stop offset="60%" stop-color="#c1121f"/>
<stop offset="100%" stop-color="#7a0c0c"/>
</linearGradient>
<linearGradient id="shieldInner" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="headTxt" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#ffdede"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

<!-- security grid lines -->
